<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C04A62;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#C04A62;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <!-- Decorative bars -->
  <rect x="10" y="20" width="3" height="20" fill="url(#barGradient)" />
  <rect x="16" y="20" width="3" height="20" fill="url(#barGradient)" opacity="0.7" />
  <rect x="22" y="20" width="3" height="20" fill="url(#barGradient)" opacity="0.5" />
  
  <!-- "allo" text -->
  <text x="35" y="38" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="600" fill="#E5E5E5">
    allo
  </text>
  
  <!-- "stasis" text with different weight -->
  <text x="80" y="38" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="300" fill="#B8B5AE">
    stasis
  </text>
  
  <!-- Decorative bars after text -->
  <rect x="155" y="20" width="3" height="20" fill="url(#barGradient)" opacity="0.5" />
  <rect x="161" y="20" width="3" height="20" fill="url(#barGradient)" opacity="0.7" />
  <rect x="167" y="20" width="3" height="20" fill="url(#barGradient)" />
</svg>